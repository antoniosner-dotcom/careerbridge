<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · CareerBridge</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="home">
  <div class="phone">
    <header class="profile">
      <div class="profile-top">
        <p>Your profile</p>
        <a class="text-link" href="index.html">Exit</a>
      </div>
      <a class="profile-row" href="my-profile.html">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div class="profile-main">
          <h1 id="student-name">Student</h1>
          <p class="meta-parts" id="student-meta"></p>
        </div>
      </a>
      <div class="profile-goal">
        <a class="profile-row" href="my-career.html">
          <span class="profile-main">Career goal</span>
          <strong id="career-name"></strong>
        </a>
      </div>
    </header>
    <main class="screen">
      <div class="content">
        <section class="card fit">
          <h2 class="card-title">Career fit</h2>
          <p class="fit-figure"><span id="fit-now"></span><span class="gain" id="fit-gain"></span></p>
          <p class="small" id="goal-text"></p>
        </section>

        <div class="card stats">
          <div class="stat"><strong id="stat-completed"></strong><span>Completed</span></div>
          <div class="stat"><strong id="stat-planned"></strong><span>In plan</span></div>
          <div class="stat"><strong id="stat-ects"></strong><span>ECTS earned</span></div>
        </div>

        <section>
          <div class="section-head">
            <h2 id="skills-title">Skills for your career</h2>
          </div>
          <div class="card stack">
            <div class="skills" id="skill-bars"></div>
            <p class="legend"><span class="key">Today</span><span class="key next">With your plan</span></p>
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>Recommended for you</h2>
            <a href="recommendations.html">See all</a>
          </div>
          <div class="stack" id="top-picks"></div>
        </section>

        <a class="card" href="plan.html">
          <div class="rec-top">
            <h3>Next semester workload</h3>
            <p class="match" id="workload-value"></p>
          </div>
          <p class="rec-why" id="workload-text"></p>
        </a>
      </div>
    </main>
    <nav class="tabs" aria-label="Main">
      <a class="tab tab-home" href="home.html" aria-current="page">Home</a>
      <a class="tab tab-courses" href="recommendations.html">Courses</a>
      <a class="tab tab-compare" href="compare.html">Compare</a>
      <a class="tab tab-plan" href="plan.html">Plan</a>
    </nav>
  </div>
</body>
</html>
